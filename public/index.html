<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roo's Purrfect Paws</title>
<meta name="description" content="Dog and cat grooming and in-home pet sitting at 5380 E Lake Road, Sheffield Lake, Ohio. Call (440) 228-3999 to book.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:ital,wght@0,400;0,600;0,800;0,900;1,600&display=swap">
<style>
/* Layout: sticky bar → blush hero (name + appointment card, soap bubbles) → scalloped edge → grooming price table → lavender pet-sitting rates → photo wall → policies + payment → about → plum visit block */
:root{
  color-scheme:light;
  --white:#ffffff;
  --blush:#fdeaf3;
  --pink:#c93a84;
  --pink-soft:#f6a9cc;
  --lav:#e6dbfa;
  --lav-soft:#f4effd;
  --lav-deep:#7a59bd;
  --plum:#3b2448;
  --plum-mut:#6f5a7c;
  --line:#efd9e8;
  --fawn:#d9a265;
  --fawn-dk:#b27a42;
  --mask:#2b1d26;
  --display:"Shrikhand","Cooper Black",Georgia,serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--white);color:var(--plum);font:17px/1.6 var(--body);font-weight:600}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--lav-deep);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo svg{flex:none;width:34px;height:34px}
.logo span{font-family:var(--display);font-size:21px;color:var(--pink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:20px}
.nav a{text-decoration:none;font-weight:800;font-size:15px;color:var(--plum-mut)}
.nav a:hover{color:var(--pink)}
.nav a.btn,.nav a.btn:hover{color:var(--white)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;border-radius:999px;border:2px solid var(--pink);background:var(--pink);color:var(--white);font:900 16px/1 var(--body);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--pink)}
.btn.ghost{background:var(--white);color:var(--pink)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}

/* hero */
.hero{position:relative;background:var(--blush);overflow:hidden}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:64px 92px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--white);color:var(--lav-deep);font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px;border:1.5px solid var(--lav)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,8vw,92px);line-height:.98;margin:20px 0 18px;color:var(--pink);text-shadow:4px 4px 0 var(--lav);text-wrap:balance;letter-spacing:-.01em}
.hero p.intro{font-size:20px;max-width:30em;margin:0 0 28px;color:var(--plum)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero-side{display:grid;justify-items:center;min-width:0}
.photo{width:min(100%,380px);aspect-ratio:1;border-radius:50% 50% 46% 54%/55% 48% 52% 45%;overflow:hidden;border:8px solid var(--white);box-shadow:0 20px 40px -20px rgba(201,58,132,.45);background:var(--lav);margin-bottom:-36px}
.photo img{width:100%;height:100%;object-fit:cover}

/* appointment card */
.card{position:relative;width:min(100%,380px);background:var(--white);border-radius:22px;padding:22px 24px 20px;box-shadow:0 18px 40px -22px rgba(59,36,72,.45);border:1.5px solid var(--line)}
.card:before,.card:after{content:"";position:absolute;top:64px;width:22px;height:22px;border-radius:50%;background:var(--blush)}
.card:before{left:-12px;border-right:1.5px solid var(--line)}
.card:after{right:-12px;border-left:1.5px solid var(--line)}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--lav-deep);font-weight:900;padding-bottom:14px;border-bottom:2px dashed var(--line);display:flex;justify-content:space-between}
.card dl{margin:0;display:grid;gap:12px}
.card dl div{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline}
.card dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--plum-mut)}
.card dd{margin:0;font-weight:800;min-width:0;overflow-wrap:anywhere}
.card dd a{text-decoration-color:var(--pink-soft);text-underline-offset:3px}

/* bubbles */
/* soap bubbles: drift up through the hero; hover or tap pops them, tapping open space blows new ones */
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:0}
.bubbles i{position:absolute;bottom:-80px;animation:rise linear infinite}
.bubbles i b,.puff b{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.25) 13% 55%,rgba(230,219,250,.55) 70%,rgba(246,169,204,.5) 100%);border:1.5px solid rgba(255,255,255,.85);opacity:.9}
.bubbles i.pop b{animation:pop .32s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.9)}50%{transform:translate(18px,-48vh) scale(1)}100%{transform:translate(-10px,-105vh) scale(1.05);opacity:0}}
@keyframes pop{0%{transform:scale(1);opacity:.9}60%{transform:scale(1.35);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.drop{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--white);box-shadow:0 0 0 1.5px var(--pink-soft);pointer-events:none;z-index:4;animation:drop .5s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.puff{position:absolute;pointer-events:none;z-index:0;animation:puff var(--d,3s) ease-out forwards}
@keyframes puff{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 260px)) scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles i{animation:none;bottom:auto}}

/* title: letters land with a squishy bounce, then a groomer's-shine sweeps across now and then */
.hero h1{position:relative}
.hero h1 .w{display:inline-block;white-space:nowrap}
.hero h1 .ch{display:inline-block;animation:jelly .9s cubic-bezier(.3,.7,.4,1.2) both;animation-delay:calc(var(--i)*45ms);transform-origin:50% 90%}
@keyframes jelly{0%{transform:translateY(-.35em) scale(1,1)}35%{transform:translateY(0) scale(1.18,.8)}55%{transform:scale(.9,1.12)}75%{transform:scale(1.05,.95)}100%{transform:none}}
@keyframes jelly2{0%,100%{transform:none}30%{transform:scale(1.2,.82)}55%{transform:scale(.9,1.12) translateY(-.06em)}78%{transform:scale(1.04,.97)}}
.hero h1 .shine{position:absolute;left:0;top:0;right:0;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%) 160% 0/260% 100% no-repeat;-webkit-background-clip:text;background-clip:text;animation:shine 7s ease-in-out 2.2s infinite}
.hero h1 .shine .ch{animation:none}
@keyframes shine{0%{background-position:160% 0}28%,100%{background-position:-60% 0}}
/* paw-print bubbles floating beside the first word of the title */
.hero h1 .w.first{position:relative}
.pawbubs{position:absolute;left:calc(100% + .22em);top:-.02em;width:1.5em;height:1.05em;pointer-events:none;text-shadow:none}
.pawbubs i{position:absolute;display:block;border-radius:50%;animation:pawfloat 4.2s ease-in-out infinite alternate;animation-delay:var(--dl)}
.pawbubs i b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.98) 0 9%,rgba(255,255,255,.55) 10% 34%,rgba(255,255,255,.18) 52%,rgba(230,219,250,.6) 78%,rgba(246,169,204,.7) 100%);
  border:2px solid rgba(255,255,255,.95);box-shadow:inset -3px -4px 8px rgba(201,58,132,.18),0 6px 14px -8px rgba(122,89,189,.55)}
.pawbubs i svg{width:50%;height:50%;color:var(--pink);opacity:.9;transform:rotate(var(--r))}
.pawbubs .b1{left:0;top:.24em;width:.6em;height:.6em}
.pawbubs .b2{left:.66em;top:0;width:.42em;height:.42em;animation-duration:3.6s}
.pawbubs .b3{left:.58em;top:.6em;width:.3em;height:.3em;animation-duration:3.1s}
@keyframes pawfloat{0%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(.03em,-.07em) rotate(3deg)}100%{transform:translate(-.02em,-.02em) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.pawbubs i{animation:none}}
.spark{position:absolute;width:18px;height:18px;color:var(--white);pointer-events:none;animation:twinkle 2.6s ease-in-out infinite;filter:drop-shadow(0 0 3px rgba(201,58,132,.5))}
.spark svg{width:100%;height:100%;display:block}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}45%,55%{transform:scale(1) rotate(45deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.hero h1 .ch,.hero h1 .shine,.spark{animation:none!important}.spark{opacity:0}}

/* walking pup: a Belgian Malinois trots along the scalloped edge, stops to sniff, leaves fading prints */
.walker{position:absolute;left:0;right:0;bottom:8px;height:96px;z-index:3;pointer-events:none;overflow:hidden}
.dog{position:absolute;bottom:0;left:0;width:117px;height:89px;visibility:hidden;will-change:transform}
.dog svg,.pupsvg{display:block;overflow:visible}
.dog svg{width:100%;height:100%}
/* dog rig artwork (shared by both dogs) */
.ro2{fill:var(--plum);stroke:var(--plum);stroke-width:4.4;stroke-linejoin:round}
.rlf2{fill:var(--fawn)}
.far .ro2{stroke-width:4}
.far .rlf2{fill:var(--fawn-dk)}
.rlm2,.rmk{fill:var(--mask)}
.rf{fill:var(--fawn);stroke:var(--plum);stroke-width:2.2;stroke-linejoin:round}
.rs{fill:var(--fawn-dk)}
.rm{fill:var(--mask);stroke:var(--plum);stroke-width:2;stroke-linejoin:round}
.rp{fill:var(--pink)}
.rw,.ew{fill:var(--white)}
.ra{fill:#f0b04a;stroke:rgba(255,222,170,.55);stroke-width:.6}
.rn{fill:#120a10}
.rl{fill:none;stroke:rgba(255,255,255,.3);stroke-width:1.2;stroke-linecap:round}
.rt{fill:var(--pink-soft);stroke:var(--plum);stroke-width:1.4;opacity:0}
.rb{opacity:0}
.rb circle,.fball circle{fill:var(--pink);stroke:var(--plum);stroke-width:1.8}
.rb path,.fball path{fill:none;stroke:var(--white);stroke-width:1.5;stroke-linecap:round}
.rsh{fill:var(--plum);fill-opacity:.14}
.reye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.8s infinite}
.rear{transform-box:fill-box;transform-origin:30% 100%;animation:twitch 6.5s infinite}
.licking .rt{opacity:1;transform-box:fill-box;transform-origin:20% 0;animation:lick .24s ease-in-out infinite alternate}
.hasball .rb{opacity:1}
@keyframes lick{from{transform:scaleY(.45)}to{transform:scaleY(1.15)}}
.swoosh{fill:none;stroke:var(--pink-soft);stroke-linecap:round;opacity:0}
.print{position:absolute;width:12px;height:12px;color:var(--pink);animation:printfade 3.2s ease-out forwards}
.print svg{width:100%;height:100%;display:block}
@keyframes printfade{0%{opacity:0}8%{opacity:.55}100%{opacity:0}}

/* pet-sitting yard: a pup runs laps around a little house, in front, then behind */
.sit-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px 32px}
.sit-head p{margin-top:12px}
.yard{position:relative;width:320px;height:180px;flex:none;max-width:100%}
.yard .ground{position:absolute;left:50%;bottom:0;width:300px;height:62px;transform:translateX(-50%);border-radius:50%;background:var(--lav)}
.yard .house{position:absolute;left:62%;bottom:24px;width:150px;height:120px;transform:translateX(-50%);z-index:2}
.yard .house svg{width:100%;height:100%;display:block;overflow:visible}
.hw{fill:var(--white);stroke:var(--plum);stroke-width:3;stroke-linejoin:round}
.hr{fill:var(--pink);stroke:var(--plum);stroke-width:3;stroke-linejoin:round}
.hd{fill:var(--lav-deep);stroke:var(--plum);stroke-width:3}
.hl{fill:var(--blush);stroke:var(--plum);stroke-width:2.5}
.hg{fill:var(--lav-deep);opacity:.55}
/* yard pup: sits and licks a paw; now and then leaps, catches a ball and backflips */
.pupsvg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.reye,.rear,.licking .rt{animation:none!important}}

/* lounging cat on the pet-sitting call bar */
.kitty{position:absolute;right:34px;bottom:100%;width:62px;height:62px;margin-bottom:-5px;pointer-events:none}
.kitty svg{width:100%;height:100%;overflow:visible;display:block}
.cb{fill:var(--lav-deep)}
.ci{fill:var(--pink-soft)}
.cw{fill:var(--white)}
.kitty .ctail{fill:none;stroke:var(--lav-deep);stroke-width:7;stroke-linecap:round;transform-box:fill-box;transform-origin:0% 100%;animation:swish 2.6s ease-in-out infinite alternate}
.kitty .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.5s infinite}
.kitty .ears{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 9s infinite}
@keyframes swish{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes twitch{0%,60%,66%,100%{transform:none}63%{transform:rotate(-4deg)}}

/* small hover touches */
.logo:hover svg{animation:paw .5s ease}
@keyframes paw{30%{transform:rotate(-14deg) scale(1.08)}60%{transform:rotate(10deg)}}
.btn:hover svg{animation:ring .5s ease}
@keyframes ring{20%{transform:rotate(-14deg)}45%{transform:rotate(12deg)}70%{transform:rotate(-6deg)}}
.prow:not(.th){transition:background .2s}
.prow:not(.th):not(.cat):hover{background:var(--blush)}
.visit-card,.policy,.methods li{transition:transform .2s,border-color .2s}
.visit-card:hover,.policy:hover,.methods li:hover{transform:translateY(-3px);border-color:var(--pink-soft)}

@media (prefers-reduced-motion:reduce){
  .dog{visibility:visible;left:24px}
  .dog *,.kitty *,.logo:hover svg,.btn:hover svg{animation:none!important}
  .visit-card:hover,.policy:hover,.methods li:hover{transform:none}
}

.scallop{height:28px;margin-top:-28px;position:relative;z-index:2;background:radial-gradient(circle at 18px 0,transparent 17px,var(--white) 18px) 0 0/36px 28px repeat-x}

section.block{padding-block:72px}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.head h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1.05;margin:0;color:var(--plum);text-wrap:balance}
.head h2 em{font-style:normal;color:var(--pink)}
.head p{margin:0;color:var(--plum-mut);max-width:34em}
.kicker{display:block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--lav-deep);margin-bottom:8px;font-family:var(--body)}

/* grooming price table */
.ptable{border:2px solid var(--line);border-radius:24px;overflow:hidden;background:var(--white)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;align-items:center;border-top:2px dotted var(--pink-soft)}
.prow:first-child{border-top:0}
.prow.th{background:var(--blush);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--plum-mut)}
.prow.th span{padding:12px 22px}
.prow.th span+span{text-align:center;padding-inline:8px}
.tier{padding:20px 22px;min-width:0}
.tier h3{margin:0;font-size:22px;font-weight:900;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tier h3 small{font-size:13px;font-weight:900;color:var(--lav-deep);background:var(--lav-soft);border-radius:999px;padding:2px 10px}
.breeds{margin:6px 0 0;font-size:15px;color:var(--plum-mut);line-height:1.5}
.amt{text-align:center;font-weight:900;font-size:22px;color:var(--pink);font-variant-numeric:tabular-nums;padding:12px 8px;white-space:nowrap}
.amt.span{grid-column:2/4}
.prow.cat{background:var(--lav-soft)}
.includes{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.box{border-radius:20px;padding:20px 22px;min-width:0}
.box h3{margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--lav-deep)}
.box.pinkbox{background:var(--blush)}
.box.lavbox{background:var(--lav)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.chips li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px;font-weight:800}
.notes li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.notes li:before{content:"!";width:20px;height:20px;border-radius:50%;background:var(--lav-deep);color:var(--white);font-size:13px;font-weight:900;display:grid;place-items:center;margin-top:2px}

/* pet sitting */
.sitting{background:var(--lav-soft);position:relative}
.sitting .head h2 em{color:var(--lav-deep)}
.visits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
.visit-card{background:var(--white);border-radius:20px;padding:18px 20px;border:1.5px solid var(--lav);min-width:0}
.visit-card b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--lav-deep);margin-bottom:4px}
.visit-card p{margin:0;font-weight:800}
.sitgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.tablewrap{overflow-x:auto;background:var(--white);border-radius:22px;border:1.5px solid var(--lav)}
table.rates{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rates th,table.rates td{padding:11px 18px;text-align:left}
table.rates thead th{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--plum-mut);background:var(--lav)}
table.rates thead th+th,table.rates td+td{text-align:right;white-space:nowrap}
table.rates tbody th{font-family:var(--display);font-weight:400;font-size:20px;color:var(--lav-deep);padding-top:16px;padding-bottom:4px}
table.rates td{border-top:1px dashed var(--lav);font-weight:800}
table.rates td+td{font-weight:900;color:var(--pink);font-size:18px}
.addons{background:var(--white);border-radius:22px;border:1.5px solid var(--lav);padding:18px 20px}
.addons h3{margin:0 0 6px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--lav-deep)}
.addons ul{list-style:none;margin:0;padding:0}
.addons li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px dashed var(--lav);font-weight:800}
.addons li:first-child{border-top:0}
.addons li span:last-child{color:var(--pink);font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.sit-incl{margin:14px 0 0;font-size:15px;color:var(--plum-mut)}
.sit-cta{position:relative;margin-top:84px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--plum);color:var(--white);border-radius:22px;padding:18px 22px}
.sit-cta p{margin:0;max-width:44em;font-size:15px;color:var(--lav)}
.sit-cta .btn{background:var(--white);color:var(--plum);border-color:var(--white)}

/* gallery */
.gallery{background:linear-gradient(var(--white),var(--blush))}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.shot{margin:0;position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--lav);cursor:zoom-in;border:0;padding:0;max-width:100%}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.shot:hover img{transform:scale(1.04)}
.shot figcaption{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--plum);font-weight:800;font-size:14px;padding:7px 12px;border-radius:12px;text-align:left}

.policy h3{margin:2px 0 6px;font-size:20px;font-weight:900}

.pol-note{margin:14px 0 0;font-size:15px;color:var(--plum-mut);font-weight:800}

.about-art .blob{position:absolute;inset:0;background:var(--lav);border-radius:58% 42% 50% 50%/45% 55% 45% 55%}
.about-art .blob.b2{inset:12% 8% 10% 14%;background:var(--white);border-radius:45% 55% 60% 40%/55% 40% 60% 45%}

.about-text p{white-space:pre-line;font-size:19px;margin:0 0 16px;max-width:36em}

footer{background:var(--plum);color:var(--lav);border-top:1px solid rgba(255,255,255,.12)}

    var first=shorts.shift();
    var pairs='';for(var j=0;j<shorts.length;j+=2)pairs+='<div class="two">'+inp(shorts[j])+(shorts[j+1]?inp(shorts[j+1]):'<div></div>')+'</div>';
    return '<div class="lrow" data-i="'+i+'"><div class="tools">'+(i>0?'<button type="button" data-mv="-1" aria-label="Move up">↑</button>':'')+(i<list.length-1?'<button type="button" data-mv="1" aria-label="Move down">↓</button>':'')+'<button type="button" data-rm>Remove</button></div>'+

function markDelete(src){if(src&&/^\/api\/img\//.test(src))pendingDeletes.push(src)}
function status(t,cls){var s=document.getElementById('pst');if(!s)return;s.className='status'+(cls?' '+cls:'');s.textContent=t}

// Shrink phone photos before upload so pages stay fast.
function shrink(file){
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){res(file);return}
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var max=1800,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file)},'image/jpeg',.85)};
    img.onerror=function(){URL.revokeObjectURL(u);res(file)};img.src=u;
  });
}

function upload(file){
  return shrink(file).then(function(f){
    if(!LIVE){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(f)})}
    var fd=new FormData();fd.append('file',f);
    return fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+TOKEN},body:fd}).then(function(r){
      return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||'Upload failed. Try a smaller JPG or PNG photo.');return j.url})});
  });
}

function addPhotos(files){
  files=[].slice.call(files||[]);if(!files.length)return;var n=0;status('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
  files.reduce(function(p,f){return p.then(function(){return upload(f).then(function(u){draft.gallery.push({src:u,cap:''});n++;drawThumbs()})})},Promise.resolve())
   .then(function(){status(n+' photo'+(n>1?'s':'')+' added. Press Save to publish.','ok')},function(err){status(err.message,'err')});
}

function save(){
  var data=JSON.parse(JSON.stringify(draft));
  data.groomTiers=data.groomTiers.filter(function(t){return (t.name||'').trim()});
  data.sitVisits=data.sitVisits.filter(function(t){return (t.title||t.body||'').trim()});
  data.sitRows=data.sitRows.filter(function(t){return (t.label||'').trim()});
  data.sitAddons=data.sitAddons.filter(function(t){return (t.label||'').trim()});
  data.policies=data.policies.filter(function(t){return (t.title||'').trim()});
  if(!LIVE){S=data;render();status('Updated on this page. Saving turns on once the site is live on Cloudflare.','ok');return}
  status('Saving…');
  fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(data)})
   .then(function(r){return r.json().catch(function(){return{}}).then(function(j){
     if(r.status===401){TOKEN='';status('Your login expired. Close the panel and log in again.','err');return}
     if(!r.ok){status(j.error||'Couldn\'t save. Try again in a moment.','err');return}
     S=data;render();status('Saved. Your site is updated.','ok');
     var dels=pendingDeletes.filter(function(src){return JSON.stringify(S).indexOf(src)<0});pendingDeletes=[];
     dels.forEach(function(src){fetch('/api/upload?key='+encodeURIComponent(src.replace(/^\/api\/img\//,'')),{method:'DELETE',headers:{Authorization:'Bearer '+TOKEN}}).catch(function(){})});
   })}).catch(function(){status('Couldn\'t reach the server. Check your connection and try again.','err')});
}

var REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function rigOf(svg){if(!svg)return null;if(!svg._rig)svg._rig=RIG.make(svg);return svg._rig}
function onScreen(el){var r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&!document.hidden}
function smooth(u){u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)}
var WSPEED=58,WSCALE=.78,WOMEGA=Math.PI*(WSPEED/WSCALE)/36;
var W={x:-130,dir:1,state:'wait',until:performance.now()+1500,stopAt:0,stopped:false,lastPrint:0,step:0,last:0,ph:0,sn:0};
function dropPrint(layer,x,step,dir){
  var p=document.createElement('div');p.className='print';
  p.style.left=x+'px';p.style.bottom=(step?3:10)+'px';p.style.transform='rotate('+(dir>0?90:-90)+'deg)';
  p.innerHTML=PAW;layer.appendChild(p);p.addEventListener('animationend',function(){p.remove()});
}
function walk(t){
  requestAnimationFrame(walk);
  var dt=Math.min(.05,(t-(W.last||t))/1000);W.last=t;
  var layer=document.querySelector('.walker'),dog=layer&&layer.querySelector('.dog');if(!dog)return;
  var svg=dog.querySelector('svg'),rig=rigOf(svg);
  if(REDUCE){if(!svg._drawn){RIG.draw(rig,POSE.stand,RIG.grounded(POSE.stand,0));svg._drawn=1}return}
  if(!onScreen(layer))return;
  var w=layer.clientWidth;
  if(W.state==='wait'){
    dog.style.visibility='hidden';if(t<W.until)return;
    W.dir=Math.random()<.5?1:-1;W.x=W.dir>0?-125:w+8;W.stopAt=w*(.25+Math.random()*.5);W.stopped=false;W.state='walk';W.sn=0;
    dog.style.visibility='visible';
  }
  if(W.state==='sniff'){
    W.sn=Math.min(1,W.sn+dt*3.2);
    if(t>W.until)W.state='walk';
  }else{
    W.sn=Math.max(0,W.sn-dt*3.2);
    var go=1-W.sn;                                  // ease back up to speed after sniffing
    W.x+=W.dir*WSPEED*dt*go;W.ph+=dt*WOMEGA*go;
    if(!W.stopped&&(W.dir>0?W.x>W.stopAt:W.x<W.stopAt)){W.stopped=true;W.state='sniff';W.until=t+1500+Math.random()*1000}
    else if(go>.8&&t-W.lastPrint>360){W.lastPrint=t;W.step^=1;dropPrint(layer,W.x+(W.dir>0?34:77),W.step,W.dir)}
    if(W.dir>0?W.x>w+10:W.x<-130){W.state='wait';W.until=t+6000+Math.random()*8000}
  }
  var pose=ANIM.walkPose(W.ph);
  if(W.sn>0){pose=RIG.mix(pose,ANIM.SNIFF,smooth(W.sn));pose.head+=4*W.sn*Math.sin(t*.03);pose.t2+=16*W.sn*Math.sin(t*.024)}
  RIG.draw(rig,pose,RIG.grounded(pose,0));
  dog.style.transform='translateX('+W.x.toFixed(1)+'px)'+(W.dir<0?' scaleX(-1)':'');
}
requestAnimationFrame(walk);

/* ---------- yard pup: sits and licks a paw; now and then catches a ball mid-leap and backflips ---------- */
var LOOKDOWN=RIG.clone(POSE.sit,{neck:66,head:62});
var Y={st:'idle',t:0,dur:2600,n:0,last:0,ball:null,mouth:null};
var BALL0={x:207,y:-84},BALLT0=ANIM.TC-1050;
function setState(st,dur){Y.st=st;Y.t=0;Y.dur=dur||0}
function idlePose(t){var p=RIG.clone(POSE.sit);p.neck+=1.4*Math.sin(t*.004);p.t2+=13*Math.sin(t*.0085);p.t1+=4*Math.sin(t*.0085+1);return p}
function yardFrame(ts){
  requestAnimationFrame(yardFrame);
  var dt=Math.min(50,ts-(Y.last||ts));Y.last=ts;
  var svg=document.querySelector('.pupsvg');if(!svg)return;
  var rig=rigOf(svg),fb=svg.querySelector('.fball'),sw=svg.querySelectorAll('.swoosh');
  if(REDUCE||!onScreen(svg)){if(!svg._drawn){RIG.draw(rig,POSE.sit,RIG.grounded(POSE.sit,0));svg._drawn=1}return}
  svg._drawn=1;Y.t+=dt;var t=Y.t,pose,c,R;
  svg.classList.toggle('licking',Y.st==='lick'&&t>300&&t<Y.dur-420);
  svg.classList.toggle('hasball',Y.st==='hold'||(Y.st==='fetch'&&t>=ANIM.TC));
  if(Y.st==='idle'){
    pose=idlePose(ts);c=RIG.grounded(pose,0);
    if(t>Y.dur){Y.n++;if(Y.n%3===0){setState('fetch',2420);Y.mouth=null}else setState('lick',2500)}
  }else if(Y.st==='lick'){
    var k=t<350?smooth(t/350):t>Y.dur-420?smooth((Y.dur-t)/420):1;
    pose=RIG.mix(idlePose(ts),POSE.lick,k);
    if(k>.9){pose.head+=5*Math.sin(t*.034);pose.neck+=2*Math.sin(t*.034+.6)}
    c=RIG.grounded(pose,0);
    if(t>Y.dur)setState('idle',2200+Math.random()*2000);
  }else if(Y.st==='fetch'){
    if(!Y.mouth){var s=ANIM.fetchState(ANIM.TC,0);Y.mouth=RIG.headPoint(RIG.solve(s.pose,s.c),32,3.5)}
    var st=ANIM.fetchState(Math.min(t,2420),0);pose=st.pose;c=st.c;
    if(t>=BALLT0&&t<ANIM.TC){
      var u=(t-BALLT0)/(ANIM.TC-BALLT0),bx=BALL0.x+(Y.mouth.x-BALL0.x)*u,by=BALL0.y+(Y.mouth.y-BALL0.y)*u-92*4*u*(1-u);
      fb.setAttribute('visibility','visible');fb.setAttribute('transform','translate('+bx.toFixed(1)+' '+by.toFixed(1)+') rotate('+(-u*540).toFixed(0)+')');
      fb.style.opacity=Math.min(1,u*8).toFixed(2);
    }else fb.setAttribute('visibility','hidden');
    if(t>2420){pose.rootA+=360;setState('hold',1900)}
  }else if(Y.st==='hold'){
    pose=RIG.clone(POSE.sit);pose.head+=6*Math.sin(t*.012);pose.t2+=24*Math.sin(t*.032);pose.t1+=8*Math.sin(t*.032+1);
    c=RIG.grounded(pose,0);
    if(t>Y.dur){R=RIG.solve(pose,c);var m=RIG.headPoint(R,32,3.5);Y.ball={x:m.x,y:m.y,vx:-75,vy:-60,a:0};setState('drop',1700)}
  }else if(Y.st==='drop'){
    var kd=t<300?smooth(t/300):t>Y.dur-450?smooth((Y.dur-t)/450):1;
    pose=RIG.mix(idlePose(ts),LOOKDOWN,kd);c=RIG.grounded(pose,0);
    var b=Y.ball,s2=dt/1000;b.vy+=1500*s2;b.x+=b.vx*s2;b.y+=b.vy*s2;b.a+=b.vx*s2*9;
    if(b.y>-6.2){b.y=-6.2;b.vy=-b.vy*.48;b.vx*=.82;if(Math.abs(b.vy)<40)b.vy=0}
    fb.setAttribute('visibility','visible');fb.setAttribute('transform','translate('+b.x.toFixed(1)+' '+b.y.toFixed(1)+') rotate('+b.a.toFixed(0)+')');
    fb.style.opacity=Math.min(1,(Y.dur-t)/450).toFixed(2);
    if(t>Y.dur){fb.setAttribute('visibility','hidden');setState('idle',2600+Math.random()*1800)}
  }
  R=RIG.draw(rig,pose,c);
  // spin trail during the flip
  var on=Y.st==='fetch'&&t>ANIM.TC+40&&t<ANIM.T1-30;
  for(var i=0;i<sw.length;i++){
    if(!on){sw[i].style.opacity=0;continue}
    var e=Math.sin(Math.PI*(t-ANIM.TC-40)/(ANIM.T1-ANIM.TC-70)),rad=i?50:64,a1=pose.rootA-40,a2=a1+(i?85:120);
    var p1x=c.x+rad*Math.cos(a1*Math.PI/180),p1y=c.y+rad*Math.sin(a1*Math.PI/180),p2x=c.x+rad*Math.cos(a2*Math.PI/180),p2y=c.y+rad*Math.sin(a2*Math.PI/180);
    sw[i].setAttribute('d','M'+p1x.toFixed(1)+' '+p1y.toFixed(1)+'A'+rad+' '+rad+' 0 0 1 '+p2x.toFixed(1)+' '+p2y.toFixed(1));
    sw[i].setAttribute('stroke-width',i?3:5);sw[i].style.opacity=(e*(i?.5:.8)).toFixed(2);
  }
}
requestAnimationFrame(yardFrame);

/* ---------- bubbles you can pop, and bouncy title letters ---------- */
function droplets(hero,x,y){
  for(var k=0;k<7;k++){var d=document.createElement('span'),a=k/7*Math.PI*2+Math.random()*.5,r=16+Math.random()*16;
    d.className='drop';d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--dx',(Math.cos(a)*r).toFixed(1)+'px');d.style.setProperty('--dy',(Math.sin(a)*r).toFixed(1)+'px');
    hero.appendChild(d);d.addEventListener('animationend',function(){this.remove()})}
}
function hitPop(hero,cx,cy){
  var hit=false,hr=hero.getBoundingClientRect();
  hero.querySelectorAll('.bubbles i:not(.pop), .puff').forEach(function(el){
    var r=el.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
    if(Math.hypot(cx-mx,cy-my)>r.width/2+6)return;
    hit=true;droplets(hero,mx-hr.left,my-hr.top);
    if(el.classList.contains('puff')){el.remove();return}
    el.classList.add('pop');
    setTimeout(function(){el.classList.remove('pop');el.style.animation='none';void el.offsetWidth;el.style.animation='';el.style.animationDelay=(Math.random()*-2).toFixed(2)+'s'},330);
  });
  return hit;
}
function blow(hero,x,y){
  if(hero.querySelectorAll('.puff').length>24)return;
  for(var k=0;k<4;k++)(function(k){setTimeout(function(){
    var p=document.createElement('span'),s=14+Math.random()*24;p.className='puff';p.innerHTML='<b></b>';
    p.style.width=p.style.height=s+'px';p.style.left=(x+(Math.random()*30-15))+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',(Math.random()*90-45).toFixed(0)+'px');p.style.setProperty('--d',(2.6+Math.random()*1.4).toFixed(2)+'s');
    hero.appendChild(p);p.addEventListener('animationend',function(){p.remove()});
  },k*90)})(k);
}
app.addEventListener('pointermove',function(e){
  if(REDUCE||e.pointerType==='touch')return;var hero=e.target.closest&&e.target.closest('.hero');if(hero)hitPop(hero,e.clientX,e.clientY);
});
app.addEventListener('pointerdown',function(e){
  if(REDUCE)return;var hero=e.target.closest&&e.target.closest('.hero');if(!hero)return;
  if(hitPop(hero,e.clientX,e.clientY))return;
  if(e.target.closest('a,button,.card,input,textarea,.eyebrow'))return;
  var hr=hero.getBoundingClientRect();blow(hero,e.clientX-hr.left,e.clientY-hr.top);
});

/* boot */
render();
fetch('/api/settings',{cache:'no-store'}).then(function(r){
  var ct=r.headers.get('content-type')||'';if(!r.ok||ct.indexOf('json')<0)throw 0;return r.json();
}).then(function(j){LIVE=true;if(j&&typeof j==='object'){for(var k in DEFAULTS)if(j[k]!=null)S[k]=j[k]}render()}).catch(function(){LIVE=false})
 .then(function(){if(location.hash==='#admin')openPanel()});
})();
</script>
